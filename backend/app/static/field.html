<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5C36">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<title>Zemli Field</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--leaf:#0E5C36;--leaf-soft:#E3EEDC;--ink:#1E2A1C;--muted:#5D6B58;--line:#D7DFD0;--page:#F3F6EF;--review:#9A5B13;--review-soft:#F8EBD7;--sick-soft:#F7E1DC}
  *{box-sizing:border-box}
  body{margin:0;font-family:Figtree,"Noto Sans Telugu",system-ui,sans-serif;background:var(--page);color:var(--ink);font-size:16px;padding-bottom:env(safe-area-inset-bottom)}
  header{background:var(--leaf);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
  header h1{font-size:19px;margin:0;flex:1}
  header button{background:transparent;border:1px solid #ffffff80;color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:14px}
  main{padding:16px;max-width:560px;margin:0 auto}
  h2{font-size:18px;margin:4px 0 12px;line-height:1.4}
  .crop{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;margin-bottom:12px;padding:12px 18px;border:1px solid var(--line);border-radius:14px;background:#fff;font:inherit;text-align:left;color:var(--ink)}
  .crop b{display:block;font-size:21px}
  .crop span{color:var(--muted)}
  .crop svg{flex:none}
  .crop.auto{background:var(--leaf);color:#fff;border-color:var(--leaf)}
  .crop.auto span{color:#E3EEDC}
  .or{color:var(--muted);font-size:14px;margin:6px 0 12px}
  .btn{display:block;width:100%;min-height:52px;border-radius:12px;font:inherit;font-weight:600;border:0;margin-top:10px;padding:12px}
  .primary{background:var(--leaf);color:#fff}
  .ghost{background:#fff;color:var(--leaf);border:1px solid var(--line)}
  .btn:disabled{opacity:.5}
  .photo{width:100%;max-height:300px;object-fit:cover;border-radius:12px;background:var(--line);display:block}
  .box{border-radius:12px;padding:16px;margin-top:14px;line-height:1.55}
  .ok{background:var(--leaf-soft)}.warn{background:var(--review-soft)}.bad{background:var(--sick-soft)}
  .box .name{font-size:22px;font-weight:600;margin:0}
  .box .te{font-size:19px;margin:2px 0 6px}
  .box hr{border:0;border-top:1px solid #0000001a;margin:12px 0}
  .muted{color:var(--muted);font-size:14px}
  .bar{display:grid;grid-template-columns:1fr 90px 44px;gap:8px;align-items:center;margin-top:8px;font-size:14px}
  .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.fill{height:100%;background:var(--leaf)}
  input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:6px;background:#fff}
  label{display:block;margin-top:12px;font-size:14px;color:var(--muted)}
  .status{display:flex;gap:10px;align-items:center;margin-top:18px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:14px}
  .dot{width:10px;height:10px;border-radius:50%;background:#B9C2B4;flex:none}.dot.on{background:#3FA34D}
  .item{display:grid;grid-template-columns:60px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .item img{width:60px;height:60px;object-fit:cover;border-radius:8px;background:var(--line)}
  .toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:14px 16px;border-radius:12px;font-size:15px;transform:translateY(160%);transition:transform .25s}
  .toast.show{transform:none}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
  .hidden{display:none}
  #camView{position:fixed;inset:0;background:#000;z-index:10;display:flex;flex-direction:column}
  #camView.hidden{display:none}
  #camView video{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
  #camView .bar2{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  #camView .hint{position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;font-size:15px;text-shadow:0 1px 3px #000}
  #shutter{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#ffffff40;flex:none}
  #camView .small{background:transparent;color:#fff;border:1px solid #ffffff80;border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;min-width:96px}
  button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<header><img src="/static/logo-mark.png" alt="" style="width:36px;height:36px;border-radius:50%;background:#fff;padding:3px;flex:none"><h1>Zemli Field</h1><button id="installBtn" class="hidden">Install app</button><button id="mineBtn">నా స్కాన్లు</button><button id="setupBtn" aria-label="Setup">⚙</button></header>
<main>
  <section id="vSetup" class="hidden">
    <h2>Setup / సెటప్</h2>
    <label>Your employee ID / మీ ఉద్యోగి ID<input id="sEmp" placeholder="VE-429" autocomplete="off"></label>
    <label>API key<input id="sKey" type="password"></label>
    <button class="btn primary" id="sSave">Save / సేవ్</button>
  </section>

  <section id="vHome" class="hidden">
    <h2>Which crop are you checking?<br>ఏ పంటను పరిశీలిస్తున్నారు?</h2>
    <label style="margin:0 0 14px">Farmer ID (optional) / రైతు ID<input id="farmer" autocomplete="off"></label>
    <div id="crops"></div>
    <input type="file" id="cam" accept="image/*" capture="environment" class="hidden">
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
  </section>

  <section id="vScan" class="hidden">
    <img class="photo" id="photo" alt="Leaf photo">
    <div id="result"></div>
    <button class="btn ghost" id="again">Scan another leaf / ఇంకో ఆకు</button>
    <button class="btn ghost" id="back">Back / వెనక్కి</button>
  </section>

  <section id="vMine" class="hidden">
    <h2>My scans / నా స్కాన్లు</h2>
    <div id="mineList" class="muted">Loading…</div>
    <button class="btn ghost" id="back2">Back / వెనక్కి</button>
  </section>
</main>
<div id="camView" class="hidden" role="dialog" aria-label="Camera">
  <p class="hint">Fill the screen with one leaf / ఒక ఆకు స్క్రీన్ నిండా వచ్చేలా తీయండి</p>
  <video id="video" playsinline muted autoplay></video>
  <div class="bar2">
    <button class="small" id="camCancel">Cancel</button>
    <button id="shutter" aria-label="Take photo"></button>
    <button class="small" id="camFile">From files</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cfg={emp:'',key:''}, crops=[], crop=null, gps=null, cropNames={};
try{cfg=JSON.parse(localStorage.getItem('zemli_field')||'{}');cfg.emp??='';cfg.key??='';}catch(e){}

function show(v){['vSetup','vHome','vScan','vMine'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==v));window.scrollTo(0,0);}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),6000);}
const headers=()=>({'X-Api-Key':cfg.key});

/* ---------- offline queue (IndexedDB) ---------- */
let dbp=null;
function db(){return dbp??=new Promise((res,rej)=>{const r=indexedDB.open('zemli',1);r.onupgradeneeded=()=>r.result.createObjectStore('queue',{keyPath:'client_id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function qop(mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('queue',mode);const r=fn(t.objectStore('queue'));t.oncomplete=()=>res(r?.result);t.onerror=()=>rej(t.error);});}
const qAdd=item=>qop('readwrite',s=>s.put(item));
const qDel=id=>qop('readwrite',s=>s.delete(id));
const qAll=()=>qop('readonly',s=>s.getAll());

async function upload(item){
  const f=new FormData();
  for(const [k,v] of Object.entries(item.fields)) if(v!==null&&v!==undefined&&v!=='') f.append(k,v);
  f.append('image',item.blob,'leaf.jpg');
  const r=await fetch('/api/scans',{method:'POST',body:f,headers:headers()});
  if(r.status===401) throw new Error('Wrong API key. Open setup and fix it.');
  if(!r.ok) throw Object.assign(new Error((await r.json().catch(()=>({}))).detail||'Server error'),{fatal:r.status===400});
  return r.json();
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{for(const item of await qAll()){try{await upload(item);await qDel(item.client_id);}catch(e){if(e.fatal){await qDel(item.client_id);}else break;}}}
  finally{flushing=false;updateStatus();}
}
async function updateStatus(){
  const n=(await qAll().catch(()=>[])).length, on=wsOpen;
  $('#dot').classList.toggle('on',on);
  $('#statusText').textContent=(on?'Connected. ':'Offline. Scans are saved and upload later. ')+(n?`${n} waiting to upload.`:'All scans uploaded.');
}

/* ---------- image + gps ---------- */
function shrink(file){ // 1600px JPEG keeps uploads fast on mobile data
  return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('Could not read photo')),'image/jpeg',0.88);URL.revokeObjectURL(img.src);};img.onerror=()=>rej(new Error('Could not read photo'));img.src=URL.createObjectURL(file);});
}
function getGps(){
  gps=null;
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(p=>{gps=p.coords;},()=>{},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}

/* ---------- camera ----------
   Phones: the native camera app (better focus and quality) via the file input.
   Laptops: a live webcam view in the page, because desktop browsers ignore the camera request
   on file inputs and just open a file picker. Needs https or localhost; otherwise falls back to files. */
let stream=null;
const isPhone=matchMedia('(pointer:coarse)').matches;
function stopCam(){stream?.getTracks().forEach(t=>t.stop());stream=null;$('#camView').classList.add('hidden');}
async function openCamera(){
  getGps();
  if(isPhone||!navigator.mediaDevices?.getUserMedia||!window.isSecureContext){$('#cam').click();return;}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    $('#video').srcObject=stream;$('#camView').classList.remove('hidden');
  }catch(e){
    toast(e.name==='NotAllowedError'?'Camera permission was blocked. Allow it from the icon in the address bar, or pick a photo from files.':'No camera found. Pick a photo from files instead.');
    $('#cam').click();
  }
}
$('#shutter').onclick=()=>{
  const v=$('#video');if(!v.videoWidth)return;
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
  c.toBlob(b=>{stopCam();if(b)onPhoto(new File([b],'leaf.jpg',{type:'image/jpeg'}));},'image/jpeg',0.92);
};
$('#camCancel').onclick=stopCam;
$('#camFile').onclick=()=>{stopCam();$('#cam').click();};

/* ---------- result view ---------- */
function renderResult(scan){
  const r=scan.result, top=scan.top_predictions[0];
  if(scan.status==='rejected'){
    $('#result').innerHTML=`<div class="box bad"><p class="name">${esc(r.name_te)}</p><p class="te">${esc(r.name_en)}</p><hr><div style="font-size:17px">${esc(r.advice_te)}</div><p class="muted">${esc(r.advice_en)}</p></div>`;
    return;
  }
  const sure=top&&top.confidence>=0.7, healthy=sure&&top.label==='healthy';
  const cls=!top?'warn':healthy?'ok':sure?'bad':'warn';
  const conf=!top?'No model for this crop yet. The agronomist will check this photo.':sure?`Confidence ${Math.round(top.confidence*100)}%`:'Low confidence. The agronomist will confirm.';
  const bars=scan.top_predictions.map(p=>`<div class="bar"><span>${esc(p.label.replaceAll('_',' '))}</span><div class="track"><div class="fill" style="width:${p.confidence*100}%"></div></div><span>${Math.round(p.confidence*100)}%</span></div>`).join('');
  const cropLine=`<p class="muted" style="margin:0 0 6px">${esc(cropNames[scan.crop]||scan.crop)}${scan.gate_label&&scan.gate_label===scan.crop?` (crop check ${Math.round(scan.gate_confidence*100)}%)`:''}</p>`;
  $('#result').innerHTML=`<div class="box ${cls}">${cropLine}<p class="name">${esc(r.name_te)}</p><p class="te">${esc(r.name_en)}</p><span class="muted">${conf}</span><hr><div style="font-size:17px">${esc(r.advice_te)}</div><p class="muted">${esc(r.advice_en)}</p>${bars}</div>
  <p class="muted">${gps?`GPS ${gps.latitude.toFixed(5)}, ${gps.longitude.toFixed(5)}`:'No GPS tag on this photo. Turn on location for the next one.'}</p>`;
}

async function onPhoto(file){
  show('vScan');
  $('#photo').src=URL.createObjectURL(file);
  $('#result').innerHTML='<div class="box warn">Checking the leaf… / పరిశీలిస్తోంది…</div>';
  try{
    const blob=await shrink(file);
    await new Promise(r=>setTimeout(r,gps?0:1500)); // short wait so GPS can arrive
    const item={client_id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),blob,fields:{}};
    item.fields={client_id:item.client_id,crop,employee_id:cfg.emp,farmer_id:$('#farmer').value.trim(),
      latitude:gps?.latitude,longitude:gps?.longitude,captured_at:new Date().toISOString()};
    await qAdd(item);
    try{const scan=await upload(item);await qDel(item.client_id);renderResult(scan);}
    catch(e){
      if(e.fatal){await qDel(item.client_id);$('#result').innerHTML=`<div class="box bad">${esc(e.message)}</div>`;}
      else $('#result').innerHTML=`<div class="box warn">No network right now. The photo is saved and will upload automatically.<br>నెట్‌వర్క్ లేదు. ఫోటో సేవ్ అయింది, తర్వాత ఆటోమేటిక్‌గా అప్‌లోడ్ అవుతుంది.<p class="muted">${esc(e.message)}</p></div>`;
    }
  }catch(e){$('#result').innerHTML=`<div class="box bad">${esc(e.message)}</div>`;}
  updateStatus();
}

/* ---------- my scans ---------- */
async function loadMine(){
  show('vMine');$('#mineList').textContent='Loading…';
  try{
    const r=await fetch(`/api/scans?employee_id=${encodeURIComponent(cfg.emp)}&limit=50`,{headers:headers()});
    if(!r.ok)throw new Error('Server replied '+r.status);
    const list=await r.json();
    $('#mineList').innerHTML=list.length?list.map(s=>`<div class="item"><img src="${esc(s.image_url)}" alt="" loading="lazy"><div><b>${esc(s.result.name_te)}</b> <span class="muted">(${esc(s.result.name_en)})</span><div class="muted">${s.status==='verified'?'Checked by '+esc(s.reviewer):s.status==='auto_healthy'?'Healthy (auto)':s.status==='rejected'?'Not this crop. Please retake.':'Waiting for agronomist'}${s.review_note?'<br>Note: '+esc(s.review_note):''}</div></div></div>`).join(''):'No uploaded scans yet.';
  }catch(e){$('#mineList').textContent='Could not reach the server. '+e.message;}
}

/* ---------- live updates ---------- */
let wsOpen=false;
function connect(){
  if(!cfg.emp)return;
  const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws?role=employee&employee_id=${encodeURIComponent(cfg.emp)}&key=${encodeURIComponent(cfg.key)}`);
  ws.onopen=()=>{wsOpen=true;updateStatus();flush();ws._p=setInterval(()=>ws.send('ping'),25000);};
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='scan_reviewed'){toast(`Agronomist checked: ${m.scan.result.name_te} (${m.scan.result.name_en})`);if(!$('#vMine').classList.contains('hidden'))loadMine();}};
  ws.onclose=()=>{wsOpen=false;clearInterval(ws._p);updateStatus();setTimeout(connect,8000);};
}

/* ---------- install as an app ---------- */
let installEvt=null;
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('#installBtn').classList.remove('hidden');});
$('#installBtn').onclick=async()=>{if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;$('#installBtn').classList.add('hidden');};
window.addEventListener('appinstalled',()=>toast('Zemli Field is installed. Open it from your home screen.'));

/* ---------- start ---------- */
$('#sSave').onclick=()=>{cfg.emp=$('#sEmp').value.trim();cfg.key=$('#sKey').value.trim();if(!cfg.emp){toast('Enter your employee ID');return;}localStorage.setItem('zemli_field',JSON.stringify(cfg));show('vHome');connect();flush();};
$('#setupBtn').onclick=()=>{$('#sEmp').value=cfg.emp;$('#sKey').value=cfg.key;show('vSetup');};
$('#mineBtn').onclick=loadMine;
$('#back').onclick=$('#back2').onclick=()=>show('vHome');
$('#again').onclick=openCamera;
$('#cam').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)onPhoto(f);};
window.addEventListener('online',flush);
setInterval(flush,30000);

(async()=>{
  try{const r=await fetch('/api/crops');crops=(await r.json()).crops;}catch(e){crops=[];}
  const leaf='<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0E5C36" stroke-width="1.8" aria-hidden="true"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"/><path d="M5 19l7-7"/></svg>';
  let autoOn=false;
  try{autoOn=(await (await fetch('/api/crops')).json()).auto_detect;}catch(e){}
  crops.forEach(c=>cropNames[c.id]=`${c.name_te} / ${c.name_en}`);
  const autoBtn=autoOn?`<button class="crop auto" data-id="auto">${leaf.replace('#0E5C36','#fff')}<div><b>ఏ ఆకైనా స్కాన్ చేయండి</b><span>Scan any leaf: the app finds the crop</span></div></button><p class="or">or pick the crop yourself / లేదా పంటను మీరే ఎంచుకోండి</p>`:'';
  $('#crops').innerHTML=autoBtn+crops.map(c=>`<button class="crop" data-id="${c.id}">${leaf}<div><b>${esc(c.name_te)}</b><span>${esc(c.name_en)}</span></div></button>`).join('')||'<p class="muted">Could not load crops. Check the server is running.</p>';
  document.querySelectorAll('.crop').forEach(b=>b.onclick=()=>{crop=b.dataset.id;openCamera();});
  if(cfg.emp){show('vHome');connect();flush();}else{$('#setupBtn').click();}
  updateStatus();
})();
</script>
</body>
</html>
