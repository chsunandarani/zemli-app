<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07110C">
<title>Zemli Agritech</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07110C;--panel:#0E1E15;--card:rgba(17,38,26,.82);--card2:rgba(12,28,19,.9);--line:rgba(120,210,145,.16);
    --glow:#5EE07F;--glow-deep:#2FA552;--glow-a:rgba(94,224,127,.5);--glow-s:rgba(94,224,127,.13);
    --ink:#E9F5EC;--ink2:#CFE3D4;--muted:#93AE9A;--dim:#647F6C;
    --gold:#F5B835;--gold-s:rgba(245,184,53,.13);--red:#FF6A55;--red-a:rgba(255,106,85,.55);--red-s:rgba(255,106,85,.13);
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;font-family:Figtree,"Noto Sans Telugu",system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.45;
    background:radial-gradient(900px 520px at 85% -8%,#18402A 0%,transparent 62%),radial-gradient(700px 480px at -15% 35%,#10301E 0%,transparent 60%),var(--bg);background-attachment:fixed}
  .hidden{display:none!important}
  a{color:var(--glow)}

  /* ---------- header + nav ---------- */
  header{position:sticky;top:0;z-index:5;background:rgba(7,17,12,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
  header .hlogo{width:38px;height:38px;border-radius:50%;background:#fff;padding:3px;flex:none;box-shadow:0 0 14px var(--glow-s)}
  header h1{flex:1;margin:0;line-height:1.15;font-size:16px}
  header h1 b{display:block;color:var(--glow);font-weight:700;letter-spacing:.07em;font-size:15px;text-shadow:0 0 12px rgba(94,224,127,.35)}
  header h1 small{color:var(--muted);font-weight:400;font-size:13px}
  header button{background:transparent;border:1px solid var(--line);color:var(--ink2);border-radius:10px;padding:7px 11px;font:inherit;font-size:13px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}.dot.on{background:var(--glow);box-shadow:0 0 10px var(--glow)}
  main{padding:16px 14px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(6,14,10,.96);border-top:1px solid var(--line);display:flex;padding:4px 4px env(safe-area-inset-bottom)}
  nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 7px;font:inherit;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;position:relative}
  nav.tabs button svg{width:24px;height:24px}
  nav.tabs button span{font-size:12px;line-height:1.2}
  nav.tabs button small{font-size:10px;opacity:.8}
  nav.tabs button.on{color:var(--glow)}
  nav.tabs button.on svg{filter:drop-shadow(0 0 6px rgba(94,224,127,.7))}
  nav.tabs button.on::before{content:"";position:absolute;top:-5px;left:30%;right:30%;height:3px;border-radius:3px;background:var(--glow);box-shadow:0 0 10px var(--glow)}

  /* ---------- type ---------- */
  .screen-title{font-size:21px;font-weight:600;color:var(--ink2);margin:2px 0 14px;line-height:1.3}
  .screen-title small{display:block;font-size:14px;font-weight:400;color:var(--muted)}
  h3{font-size:16px;font-weight:600;color:var(--ink2);margin:20px 0 10px}
  .muted{color:var(--muted);font-size:14px}
  .money{font-variant-numeric:tabular-nums}
  .g{color:var(--glow)}.r{color:var(--red)}.y{color:var(--gold)}

  /* ---------- surfaces ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .glow{border-color:var(--glow-a);box-shadow:0 0 0 1px rgba(94,224,127,.06),0 0 24px rgba(94,224,127,.16),inset 0 0 26px rgba(94,224,127,.05)}
  .glow-red{border-color:var(--red-a);box-shadow:0 0 22px rgba(255,106,85,.14),inset 0 0 24px rgba(255,106,85,.05);background:linear-gradient(180deg,rgba(60,18,14,.55),rgba(30,14,12,.7))}
  .glow-gold{border-color:rgba(245,184,53,.5);box-shadow:0 0 22px rgba(245,184,53,.12)}
  .row{display:flex;align-items:center;gap:12px}
  .grow{flex:1;min-width:0}
  .kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
  .kv:last-child{border:0}
  .kv span{color:var(--muted)}
  .big{font-size:30px;font-weight:700;letter-spacing:-.01em}
  .bar{height:9px;background:#163022;border-radius:6px;overflow:hidden;margin:10px 0 4px}
  .bar div{height:100%;background:var(--glow);box-shadow:0 0 12px var(--glow)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  .tile .label{font-size:13px;color:var(--muted)}
  .tile .val{font-size:24px;font-weight:700;margin-top:4px}
  .pill{display:inline-flex;align-items:center;gap:8px;border-radius:30px;padding:8px 14px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card2)}
  .pill.on{border-color:var(--glow-a);color:var(--glow);box-shadow:0 0 16px rgba(94,224,127,.2)}
  .pill.off{color:var(--muted)}
  .pill.bad{border-color:var(--red-a);color:var(--red)}
  .pill svg{width:18px;height:18px}
  .tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:20px;background:var(--glow-s);color:var(--glow);font-weight:500}
  .tag.warn{background:var(--gold-s);color:var(--gold)}.tag.bad{background:var(--red-s);color:var(--red)}

  /* ---------- controls ---------- */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;font:inherit;font-weight:600;border:0;margin-top:10px;padding:12px;cursor:pointer}
  .primary{background:var(--glow);color:#03130A;box-shadow:0 0 22px rgba(94,224,127,.35)}
  .ghost{background:transparent;color:var(--glow);border:1px solid var(--glow-a)}
  .btn:disabled{opacity:.45;box-shadow:none}
  .btn svg{width:20px;height:20px}
  label{display:block;margin-top:12px;font-size:14px;color:var(--muted)}
  input,select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:6px;background:#0A1912;color:var(--ink)}
  input::placeholder{color:var(--dim)}
  input:focus,select:focus{outline:none;border-color:var(--glow-a);box-shadow:0 0 0 3px var(--glow-s)}
  .seg{display:flex;gap:8px;margin-top:6px}
  .seg label{flex:1;margin:0;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--card2);color:var(--ink);font-size:14px;cursor:pointer}
  .seg input{width:auto;margin:0 6px 0 0;accent-color:var(--glow)}
  .seg label:has(input:checked){border-color:var(--glow-a);box-shadow:0 0 14px rgba(94,224,127,.18)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;border:1px solid var(--line);background:var(--card2);border-radius:20px;padding:8px 14px;font:inherit;font-size:14px;color:var(--ink2)}
  .chips button.on{border-color:var(--glow-a);color:var(--glow);box-shadow:0 0 14px rgba(94,224,127,.22)}
  .chips button small{opacity:.7;margin-left:4px}
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

  /* ---------- employee: farmers ---------- */
  .group-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .group-head b{color:var(--glow);font-weight:600}
  .farmer{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;font:inherit;color:inherit}
  .farmer:active{border-color:var(--glow-a)}
  .avatar{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2E6E45,#143823);color:#DDF7E4;display:grid;place-items:center;font-weight:700;font-size:19px;flex:none;border:1px solid var(--glow-a)}
  .farmer .name{font-size:18px;font-weight:600}
  .verif{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2)}
  .verif i{width:15px;height:15px;border-radius:50%;background:var(--glow);display:inline-grid;place-items:center;color:#03130A;font-style:normal;font-size:10px;font-weight:700}
  .farmer .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
  .farmer .meta b{color:var(--glow);font-weight:600}
  .roundbtn{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;background:#173322;color:var(--ink2);border:1px solid var(--line);text-decoration:none;flex:none}
  .roundbtn svg{width:18px;height:18px}

  /* ---------- rings, charts ---------- */
  .ringwrap{position:relative;width:min(250px,70vw);aspect-ratio:1;margin:6px auto 18px}
  .ringwrap svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  .ringwrap .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16%}
  .ringwrap .center span{color:var(--ink2);font-size:14px}
  .ringwrap .center b{font-size:34px;color:var(--glow);text-shadow:0 0 18px rgba(94,224,127,.45);margin:4px 0}
  .ring-bg{fill:#0B1B12;stroke:#173322}
  .ring-fg{fill:none;stroke:var(--glow);stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(94,224,127,.8))}
  .spark{width:100%;height:70px;display:block;margin-top:10px}
  .bars{display:flex;align-items:flex-end;gap:5px;height:70px;margin-top:10px}
  .bars div{flex:1;border-radius:4px 4px 0 0;background:#3B6E4A}
  .bars div.hi{background:var(--glow);box-shadow:0 0 10px rgba(94,224,127,.5)}

  /* ---------- ledger, payouts ---------- */
  .ledger{background:var(--card);border:1px solid var(--glow-a);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:0 0 16px rgba(94,224,127,.1)}
  .ledger .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .ledger .top b{font-size:17px;font-weight:600}
  .ledger .amt{font-size:22px;font-weight:700;color:var(--glow);white-space:nowrap}
  .ledger .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .ledger .sub em{font-style:normal;color:var(--ink2)}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .mark{width:46px;height:46px;border-radius:50%;background:#F1E6C8;color:#2C5E1A;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
  .brand small{display:block;color:var(--muted);font-size:13px}
  .brand b{font-size:19px}
  .ded{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:16px}
  .ded svg{width:20px;height:20px;color:var(--red);flex:none}
  .ded span{flex:1;min-width:0}
  .ded b{margin-left:auto;color:var(--red);white-space:nowrap}
  .netcard{border:2px solid var(--glow);border-radius:18px;padding:16px;background:rgba(10,30,18,.95);box-shadow:0 0 30px rgba(94,224,127,.3);display:flex;align-items:center;gap:14px;margin-top:12px}
  .netcard .t{font-size:16px;color:var(--ink2)}
  .netcard .v{font-size:28px;font-weight:700;color:var(--glow)}
  .netcard svg{width:46px;height:46px;color:var(--glow);flex:none;filter:drop-shadow(0 0 8px rgba(94,224,127,.6))}

  /* ---------- crop care ---------- */
  .cropbtn{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;margin-bottom:10px;padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);font:inherit;text-align:left;color:var(--ink)}
  .cropbtn.auto{border-color:var(--glow-a);box-shadow:0 0 18px rgba(94,224,127,.18)}
  .cropbtn b{display:block;font-size:18px}
  .cropbtn span{color:var(--muted);font-size:14px}
  .cropbtn b+*{color:var(--muted)}
  .cropbtn svg{width:30px;height:30px;flex:none;color:var(--glow)}
  .photo{width:100%;max-height:300px;object-fit:cover;border-radius:16px;background:#0B1B12;display:block;border:1px solid var(--line)}
  .result-pill{display:block;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:17px;border:1px solid}
  .result-pill.bad{border-color:var(--red-a);background:var(--red-s);box-shadow:0 0 18px rgba(255,106,85,.2)}
  .result-pill.bad .h{color:var(--red)}
  .result-pill.ok{border-color:var(--glow-a);background:var(--glow-s);box-shadow:0 0 18px rgba(94,224,127,.18)}
  .result-pill.ok .h{color:var(--glow)}
  .result-pill.warn{border-color:rgba(245,184,53,.5);background:var(--gold-s)}
  .result-pill.warn .h{color:var(--gold)}
  .result-pill .te{display:block;font-size:20px;font-weight:600;margin-top:2px}
  .action{margin-top:12px}
  .action .head{display:flex;align-items:center;gap:12px;color:var(--ink);font-size:19px;font-weight:600}
  .action .head svg{width:42px;height:42px;color:var(--glow);flex:none}
  .action .te{color:var(--glow);font-size:18px;margin:10px 0 6px;line-height:1.55}
  .carelog{display:grid;grid-template-columns:66px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .carelog:last-child{border:0}
  .carelog img{width:66px;height:66px;object-fit:cover;border-radius:12px;background:#0B1B12}

  /* ---------- notices ---------- */
  .notice{border-radius:16px;padding:13px 15px;margin-bottom:12px;line-height:1.5;border:1px solid}
  .notice b{font-size:16px}
  .notice.moisture{border-color:var(--red-a);background:var(--red-s)}
  .notice.payment{border-color:var(--glow-a);background:var(--glow-s)}
  .notice.disease{border-color:rgba(245,184,53,.5);background:var(--gold-s)}

  /* ---------- field attendance ---------- */
  .shutter-big{display:grid;place-items:center;margin:8px auto 4px;width:170px;height:170px;border-radius:50%;border:0;background:radial-gradient(circle,#173a25 0%,#0b1a11 70%);
    box-shadow:0 0 0 10px rgba(94,224,127,.08),0 0 0 22px rgba(94,224,127,.04),0 0 40px rgba(94,224,127,.35),inset 0 0 0 3px var(--glow);color:var(--glow);font:inherit;cursor:pointer}
  .shutter-big svg{width:62px;height:62px;filter:drop-shadow(0 0 10px rgba(94,224,127,.8))}
  .shutter-big:active{transform:scale(.97)}
  .center{text-align:center}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
  .cal .h{font-size:11px;color:var(--dim);text-align:center}
  .cal .d{aspect-ratio:1;border-radius:10px;background:#0B1A12;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--dim)}
  .cal .d.ok{border-color:var(--glow-a);color:var(--glow);background:rgba(94,224,127,.12);box-shadow:0 0 10px rgba(94,224,127,.18)}
  .cal .d.part{border-color:rgba(245,184,53,.55);color:var(--gold);background:var(--gold-s)}
  .cal .d.today{outline:2px solid var(--ink2);outline-offset:1px}
  .visit{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .visit:last-child{border:0}
  .visit img{width:76px;height:76px;object-fit:cover;border-radius:12px;background:#0B1A12}

  /* ---------- camera ---------- */
  #camView{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
  #camView video{flex:1;width:100%;min-height:0;object-fit:cover}
  .camchip{position:absolute;background:rgba(5,14,9,.72);color:#E9F5EC;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:7px 11px;font-size:14px;backdrop-filter:blur(6px)}
  #camEmp{top:calc(14px + env(safe-area-inset-top));left:14px}
  #camTime{top:calc(14px + env(safe-area-inset-top));right:14px;text-align:right;font-size:13px}
  #camGps{left:14px;right:14px;bottom:calc(150px + env(safe-area-inset-bottom));font-size:13px}
  .frame{position:absolute;left:50%;top:44%;width:min(62vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none}
  .frame i{position:absolute;width:34px;height:34px;border:3px solid var(--glow);filter:drop-shadow(0 0 6px var(--glow))}
  .frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
  .frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
  .frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
  .frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
  .frame b{position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);border:2px solid var(--glow);border-radius:50%;filter:drop-shadow(0 0 6px var(--glow))}
  .frame b::before,.frame b::after{content:"";position:absolute;background:var(--glow)}
  .frame b::before{left:50%;top:-14px;bottom:-14px;width:2px;transform:translateX(-50%)}
  .frame b::after{top:50%;left:-14px;right:-14px;height:2px;transform:translateY(-50%)}
  .cambar{background:#05100A;padding:12px 20px calc(16px + env(safe-area-inset-bottom));text-align:center}
  .cambar p{margin:0 0 10px;color:var(--ink2);font-size:14px}
  .cambar .r3{display:flex;align-items:center;justify-content:space-between}
  #shutter{width:78px;height:78px;border-radius:50%;border:0;background:radial-gradient(circle,#2a5a3a,#0d2016);box-shadow:0 0 0 4px var(--glow),0 0 26px rgba(94,224,127,.6);color:var(--ink);display:grid;place-items:center}
  #shutter svg{width:36px;height:36px}
  .smallw{background:transparent;color:var(--ink2);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;min-width:88px}

  /* ---------- sheet, toast, login ---------- */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:15;display:flex;align-items:flex-end}
  .sheet{background:#0B1912;border-top:1px solid var(--glow-a);box-shadow:0 -10px 40px rgba(94,224,127,.12);width:100%;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
  .toast{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:30;background:#0F2A1B;border:1px solid var(--glow-a);color:var(--ink);padding:14px 16px;border-radius:14px;font-size:15px;box-shadow:0 0 24px rgba(94,224,127,.25);
    transform:translateY(200%);transition:transform .25s,visibility .25s;max-width:600px;margin:0 auto;pointer-events:none;visibility:hidden}
  .toast.show{transform:none;visibility:visible}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}.shutter-big:active{transform:none}}
  .login{max-width:420px;margin:0 auto;padding:calc(34px + env(safe-area-inset-top)) 20px 30px;min-height:100vh}
  .login .logo{width:min(250px,72vw);height:auto;display:block;margin:0 auto 14px;background:#fff;border-radius:22px;padding:8px;box-shadow:0 0 0 1px var(--glow-a),0 0 40px rgba(94,224,127,.25)}
  .login p{text-align:center}
  .demo{background:var(--gold-s);color:var(--gold);border:1px solid rgba(245,184,53,.4);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}
  .err{color:var(--red);font-size:14px;margin-top:10px}
  hr.soft{border:0;border-top:1px solid var(--line);margin:12px 0}
</style>
</head>
<body>

<section id="vLogin" class="login hidden">
  <img class="logo" src="/static/logo-full-600.png" alt="Zemli Agritech: smart farms, stronger farmers, greener tomorrow">
  <p class="muted">రైతులు మరియు Zemli ఉద్యోగుల కోసం<br>For farmers and Zemli employees</p>
  <div id="stepPhone">
    <label>మొబైల్ నంబర్ / Mobile number<input id="lPhone" type="tel" inputmode="numeric" maxlength="14" placeholder="98765 43210" autocomplete="tel"></label>

let token=localStorage.getItem('zemli_token')||'', me=null, groups=[], curGroup=1, crops=[], autoOn=false;

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),6000);}
async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});
  if(r.status===401&&token){logout(true);throw new Error('Please log in again');}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.detail||('Server error '+r.status));
  return j;
}
function sheet(html){$('#sheetBody').innerHTML=html;$('#sheet').classList.remove('hidden');}
function closeSheet(){$('#sheet').classList.add('hidden');}
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet();};
const title=(en,te)=>`<h2 class="screen-title">${en}${te?`<small>${te}</small>`:''}</h2>`;
function ring(fraction,centerHtml){
  const r=88,c=2*Math.PI*r,f=Math.max(0,Math.min(1,fraction));
  return `<div class="ringwrap"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="ring-bg" cx="100" cy="100" r="${r}" stroke-width="14"/>
    <circle class="ring-fg" cx="100" cy="100" r="${r}" stroke-width="14" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-f)}"/></svg><div class="center">${centerHtml}</div></div>`;
}
function spark(vals,minV,maxV){
  if(vals.length<2)return '<p class="muted">Not enough readings yet.</p>';
  const lo=minV??Math.min(...vals), hi=maxV??Math.max(...vals), span=(hi-lo)||1, W=300,H=70;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*W, H-6-((v-lo)/span)*(H-14)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d} L${W} ${H} L0 ${H} Z" fill="rgba(94,224,127,.14)"/><path d="${d}" fill="none" stroke="#5EE07F" stroke-width="2.5" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 4px rgba(94,224,127,.8))"/></svg>`;
}

/* ======================= LOGIN ======================= */
function showLogin(){

  $('#vLogin').classList.remove('hidden');$('#stepPhone').classList.remove('hidden');$('#stepCode').classList.add('hidden');$('#lErr').textContent='';
}
$('#lSend').onclick=async()=>{

    if(r.demo_otp){$('#lDemo').classList.remove('hidden');$('#lDemo').textContent=`Demo mode (no SMS yet): your code is ${r.demo_otp}`;}

$('#lVerify').onclick=async()=>{

    token=r.token;localStorage.setItem('zemli_token',token);await start();
  }catch(e){$('#lErr').textContent=e.message;}

};
$('#lBack').onclick=showLogin;
async function logout(expired){
  if(!expired)try{await api('/api/auth/logout',{method:'POST'});}catch(e){}
  token='';localStorage.removeItem('zemli_token');localStorage.removeItem('zemli_cache');try{ws&&ws.close();}catch(e){}
  showLogin();if(expired)$('#lErr').textContent='Your login expired. Please log in again.';
}
$('#logout').onclick=()=>{if(confirm('Log out?'))logout(false);};

function shell(sub,tabs){

let views={}, curView='';
function go(v){curView=v;$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));window.scrollTo(0,0);views[v]();}

/* ======================= OFFLINE QUEUE (scans + field photos) ======================= */
let dbp=null;
function db(){return dbp??=new Promise((res,rej)=>{const r=indexedDB.open('zemli-app',1);r.onupgradeneeded=()=>r.result.createObjectStore('queue',{keyPath:'client_id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function qop(mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('queue',mode);const r=fn(t.objectStore('queue'));t.oncomplete=()=>res(r?.result);t.onerror=()=>rej(t.error);});}
const qAdd=i=>qop('readwrite',s=>s.put(i)), qDel=id=>qop('readwrite',s=>s.delete(id)), qAll=()=>qop('readonly',s=>s.getAll());
async function upload(item){
  const f=new FormData();
  for(const [k,v] of Object.entries(item.fields)) if(v!==null&&v!==undefined&&v!=='') f.append(k,v);
  f.append('image',item.blob,'photo.jpg');
  const url=item.kind==='field'?'/api/emp/field-visit':'/api/scans';
  const r=await fetch(url,{method:'POST',body:f,headers:{Authorization:'Bearer '+token}});
  if(r.status===401)throw new Error('Please log in again');
  if(!r.ok)throw Object.assign(new Error((await r.json().catch(()=>({}))).detail||'Server error'),{fatal:r.status===400||r.status===413});
  return r.json();
}
let flushing=false;
async function flush(){
  if(flushing||!token||!me)return;flushing=true;
  try{for(const it of await qAll()){if(it.kind==='field'&&me.role!=='employee')continue;try{await upload(it);await qDel(it.client_id);}catch(e){if(e.fatal)await qDel(it.client_id);else break;}}}
  finally{flushing=false;}
}
window.addEventListener('online',flush);setInterval(flush,30000);

/* ======================= LIVE GPS CAMERA ======================= */
let stream=null, gps=null, gpsWatch=null, camResolve=null, clock=null;
function startGps(){
  gps=null;$('#camGps').textContent='GPS వెతుకుతోంది… / Finding GPS…';
  if(!navigator.geolocation){$('#camGps').textContent='No GPS on this device';return;}
  gpsWatch=navigator.geolocation.watchPosition(p=>{gps=p.coords;$('#camGps').textContent=`📡 Geo-tagged GPS: ${gps.latitude.toFixed(5)}°N, ${gps.longitude.toFixed(5)}°E · ±${Math.round(gps.accuracy)} m`;},
    ()=>{$('#camGps').textContent='GPS ఆఫ్‌లో ఉంది. లొకేషన్ ఆన్ చేయండి / Turn on location';},{enableHighAccuracy:true,maximumAge:10000,timeout:20000});
}
function stopCam(){stream?.getTracks().forEach(t=>t.stop());stream=null;if(gpsWatch!=null)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;clearInterval(clock);$('#camView').classList.add('hidden');}
function liveCamera(mode){
  return new Promise(async(resolve)=>{
    if(!navigator.mediaDevices?.getUserMedia||!window.isSecureContext){toast('Camera needs the secure (https) app address.');resolve(null);return;}
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});}
    catch(e){toast(e.name==='NotAllowedError'?'Allow camera permission for Zemli and try again.':'Camera not available on this device.');resolve(null);return;}
    $('#camEmp').textContent=me.role==='employee'?`Employee ID: ${me.scan_id}`:`Farmer: ${me.name}`;
    $('#camHint').textContent=mode==='field'?'పొలంలో ఉండి ఫోటో తీయండి / Take the daily field photo at the farm, then press capture':'ఒక ఆకు ఫ్రేమ్ నిండా వచ్చేలా తీయండి / Fill the frame with one leaf, then press capture';
    const tick=()=>{const n=new Date();$('#camTime').innerHTML=`${n.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}<br>${n.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})} IST`;};
    tick();clock=setInterval(tick,15000);
    $('#video').srcObject=stream;$('#camView').classList.remove('hidden');startGps();camResolve=resolve;
  });
}
$('#shutter').onclick=()=>{
  const v=$('#video');if(!v.videoWidth)return;
  const s=Math.min(1,1600/Math.max(v.videoWidth,v.videoHeight));
  const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  const at=new Date().toISOString(), g=gps?{latitude:gps.latitude,longitude:gps.longitude,accuracy:gps.accuracy}:null;
  c.toBlob(b=>{stopCam();camResolve&&camResolve(b?{blob:b,captured_at:at,gps:g}:null);camResolve=null;},'image/jpeg',0.88);
};
$('#camCancel').onclick=()=>{stopCam();camResolve&&camResolve(null);camResolve=null;};
function pickFile(){
  return new Promise(res=>{
    const inp=$('#filePick');inp.value='';
    const done=()=>{window.removeEventListener('focus',onFocus);};
    const onFocus=()=>setTimeout(()=>{if(!inp.files.length){done();res(null);}},800);
    inp.onchange=async()=>{done();const f=inp.files[0];if(!f)return res(null);
      if(f.size<=9.5*1024*1024)return res({blob:f,captured_at:null,gps:null,source:'upload'});
      try{const b=await shrinkFile(f);res({blob:b,captured_at:null,gps:null,source:'upload'});}catch(e){toast('Could not read that photo');res(null);}
    };
    window.addEventListener('focus',onFocus);inp.click();
  });
}
function shrinkFile(file){
  return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(),'image/jpeg',0.88);URL.revokeObjectURL(img.src);};img.onerror=rej;img.src=URL.createObjectURL(file);});
}
function choosePhoto(){
  return new Promise(res=>{
    sheet(`${title('Add a leaf photo','ఫోటో ఎలా ఇవ్వాలి?')}
      <button class="cropbtn auto" id="chCam">${icons.camera}<span><b>కెమెరా / Camera</b>Live photo: GPS and time are recorded</span></button>
      <button class="cropbtn" id="chFile">${icons.image}<span><b>ఫోటో అప్‌లోడ్ / Upload photo</b>Choose from the gallery or files</span></button>
      <button class="btn ghost" id="chCancel">Cancel</button>`);
    $('#chCam').onclick=async()=>{closeSheet();const s=await liveCamera('leaf');res(s&&{...s,source:'camera'});};
    $('#chFile').onclick=async()=>{closeSheet();res(await pickFile());};
    $('#chCancel').onclick=()=>{closeSheet();res(null);};
  });
}
function getPosition(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('No GPS'));navigator.geolocation.getCurrentPosition(p=>res(p.coords),e=>rej(new Error('Turn on location and allow it for Zemli')),{enableHighAccuracy:true,timeout:20000,maximumAge:0});});}

/* ======================= EMPLOYEE ======================= */
async function loadGroups(){
  try{groups=await api('/api/emp/groups');localStorage.setItem('zemli_cache',JSON.stringify(groups));}
  catch(e){groups=JSON.parse(localStorage.getItem('zemli_cache')||'[]');if(!groups.length)throw e;toast('Offline: showing saved farmer list');}
}
function groupChips(sel){return `<div class="chips">${groups.map(g=>`<button data-g="${g.id}" class="${g.id===sel?'on':''}">గ్రూప్ ${g.id}<small>${g.farmers.length}/10</small></button>`).join('')}</div>`;}
function bindChips(onPick){document.querySelectorAll('.chips button[data-g]').forEach(b=>b.onclick=()=>{curGroup=+b.dataset.g;onPick();});}
const grp=()=>groups.find(g=>g.id===curGroup)||{farmers:[]};
const clusterId=gid=>`ZM-GNT-${String(100+gid)}`;

views.farmers=async()=>{
  const m=$('#main');m.innerHTML='<p class="muted">Loading…</p>';
  try{await loadGroups();}catch(e){m.innerHTML=`<p class="err">${esc(e.message)}</p>`;return;}

  m.innerHTML=`${title('Farmer groups','రైతు గ్రూపులు')}${groupChips(curGroup)}
    <div class="group-head"><div>Farmer group: <b>${esc(g.village||g.name)}</b></div><span class="muted">${g.farmers.length} / 10 members</span></div>
    ${g.farmers.map(f=>`<div class="farmer" role="button" tabindex="0" data-f="${f.id}">
      <div class="row"><span class="avatar">${esc(f.name[0]||'?')}</span>
        <div class="grow"><div class="name">${esc(f.name)}</div>${f.aadhaar?'<span class="verif"><i>✓</i>Aadhaar linked</span>':'<span class="tag warn">No Aadhaar yet</span>'}</div>
        <span class="muted" style="text-align:right;font-size:13px">${esc(f.package_label)}</span></div>
      <div class="meta"><span>${f.aadhaar?`Aadhaar: ${esc(f.aadhaar)}<br>`:''}Cluster ID: <b>${clusterId(f.group_id)}</b>
        ${f.pending_bill>0?`<br>Bill: <span class="y">${rs(f.pending_bill)}</span>`:''}${f.latitude==null?'<br><span class="y">No farm GPS</span>':''}</span>
        <span class="row" style="gap:8px"><a class="roundbtn" href="tel:${esc(f.phone)}" aria-label="Call ${esc(f.name)}" onclick="event.stopPropagation()">${icons.phone}</a><span class="roundbtn">${icons.arrow}</span></span></div>
    </div>`).join('')||'<div class="card muted">No farmers in this group yet.</div>'}
    ${g.farmers.length<10?'<button class="btn primary" id="addF">+ కొత్త రైతు / Add farmer</button>':''}`;
  bindChips(views.farmers);
  $('#addF')&&($('#addF').onclick=onboardForm);
  document.querySelectorAll('.farmer').forEach(b=>{b.onclick=()=>farmerSheet(+b.dataset.f);b.onkeydown=e=>{if(e.key==='Enter')farmerSheet(+b.dataset.f);};});
};
function findFarmer(id){for(const g of groups)for(const f of g.farmers)if(f.id===id)return f;return null;}
function farmerSheet(id){
  const f=findFarmer(id);if(!f)return;
  sheet(`${title(esc(f.name),esc(f.village||''))}

function renderFieldMonth(){
  const d=fieldMonth, tv=d.today_visits||[];
  const verifiedToday=tv.some(v=>v.verified);
  $('#fToday').className='card '+(tv.length?(verifiedToday?'glow':'glow-gold'):'');
  $('#fToday').innerHTML=tv.length?`<div class="row"><span class="pill ${verifiedToday?'on':''}" style="${verifiedToday?'':'color:var(--gold);border-color:rgba(245,184,53,.5)'}">${icons.shield}${verifiedToday?'Field day recorded':'Photo saved, not near a farm'}</span></div>
      <div class="kv" style="margin-top:8px"><span>Photos today</span><b>${tv.length}</b></div>
      <div class="kv"><span>First photo</span><b>${esc(tv[tv.length-1].time_ist)}</b></div>
      <div class="kv"><span>Latest photo</span><b>${esc(tv[0].time_ist)}</b></div>`
    :`<div class="row"><span class="pill off">${icons.shield}No field photo yet today</span></div><p class="muted" style="margin:10px 0 0">ఈ రోజు ఇంకా ఫీల్డ్ ఫోటో లేదు. Take one at a farmer's field to count today.</p>`;
  const [y,mo]=d.month.split('-').map(Number), first=new Date(y,mo-1,1), days=new Date(y,mo,0).getDate(), lead=(first.getDay()+6)%7;
  const byDay=Object.fromEntries(d.days.map(x=>[x.day,x]));
  let cells='';for(let i=0;i<lead;i++)cells+='<div></div>';
  for(let n=1;n<=days;n++){const k=`${d.month}-${String(n).padStart(2,'0')}`,x=byDay[k];cells+=`<div class="d ${x?(x.verified?'ok':'part'):''} ${k===d.today?'today':''}" title="${x?`${x.photos} photo(s), ${x.first}${x.photos>1?' to '+x.last:''}`:''}">${n}</div>`;}
  const mname=first.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  $('#fMonth').innerHTML=`<div class="tiles"><div class="tile glow"><div class="label">Field days in ${first.toLocaleDateString('en-IN',{month:'short'})}</div><div class="val g">${d.field_days}</div></div>
      <div class="tile"><div class="label">Not verified</div><div class="val ${d.unverified_days?'y':''}">${d.unverified_days}</div></div></div>
    <div class="card"><b>${esc(mname)}</b><div class="cal">${['M','T','W','T','F','S','S'].map(h=>`<div class="h">${h}</div>`).join('')}${cells}</div>
      <p class="muted" style="margin:12px 0 0"><span class="g">■</span> counted (within ${Math.round(d.radius_m)} m of a farm) &nbsp; <span class="y">■</span> photo taken away from farms or without GPS</p></div>
    ${tv.length?`<h3>Today's photos</h3><div class="card">${tv.map(v=>`<div class="visit"><img src="${esc(v.image_url)}" alt="Field photo" loading="lazy"><div>
      <b>${esc(v.time_ist)}</b> ${v.verified?'<span class="tag">counted</span>':'<span class="tag warn">not counted</span>'}<br>
      <span class="muted">${v.nearest_farmer?`Near ${esc(v.nearest_farmer)}'s farm · ${v.distance_m} m`:'No farm nearby'}</span>
      ${v.flags.length?`<br><span class="y" style="font-size:13px">${v.flags.map(esc).join(' · ')}</span>`:''}</div></div>`).join('')}</div>`:''}`;
}
async function takeFieldPhoto(){
  const shot=await liveCamera('field');if(!shot)return;
  if(!shot.gps&&!confirm('GPS was not found. The photo will be saved but will not count as a field day. Continue?'))return;
  const id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
  const item={client_id:id,kind:'field',blob:shot.blob,fields:{client_id:id,captured_at:shot.captured_at,latitude:shot.gps?.latitude,longitude:shot.gps?.longitude,accuracy:shot.gps?.accuracy}};
  await qAdd(item);
  try{const v=await upload(item);await qDel(id);toast(v.verified?`ఫీల్డ్ డే నమోదైంది / Field day recorded: near ${v.nearest_farmer}`:`Photo saved: ${v.flags[0]||'not near a registered farm'}`);}
  catch(e){if(e.fatal){await qDel(id);toast(e.message);}else toast('No network. Photo saved with GPS and time; it uploads automatically.');}
  views.field();
}

let scanFarmer=null;
function cropButtons(){

views.scan=async()=>{
  const m=$('#main');
  if(!groups.length){try{await loadGroups();}catch(e){}}
  if(scanFarmer){const fg=groups.find(x=>x.farmers.some(f=>f.id===scanFarmer));if(fg)curGroup=fg.id;}
  const pending=(await qAll().catch(()=>[])).filter(x=>x.kind!=='field').length;
  m.innerHTML=`${title('AI crop disease advisory','పంట స్కాన్')}${groupChips(curGroup)}
    <label>రైతు / Farmer<select id="scF"><option value="">Choose farmer…</option>${grp().farmers.map(f=>`<option value="${f.id}" ${f.id===scanFarmer?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label>

    <div id="scanOut"></div>`;

async function doScan(crop){
  if(me.role==='employee'&&!scanFarmer){toast('Choose the farmer first / ముందు రైతును ఎంచుకోండి');return;}
  const shot=await choosePhoto();if(!shot)return;
  const item={client_id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),kind:'scan',blob:shot.blob,
    fields:{crop,source:shot.source,employee_id:me.scan_id||'self',farmer_id:me.role==='employee'?scanFarmer:me.id,latitude:shot.gps?.latitude,longitude:shot.gps?.longitude,captured_at:shot.captured_at}};
  item.fields.client_id=item.client_id;
  const out=$('#scanOut'), img=`<img class="photo" src="${URL.createObjectURL(shot.blob)}" alt="Leaf photo">`;
  out.innerHTML=img+`<div class="result-pill warn"><span class="h">Scanning…</span><span class="te">పరిశీలిస్తోంది…</span></div>`;
  out.scrollIntoView({behavior:'smooth'});
  await qAdd(item);
  try{const s=await upload(item);await qDel(item.client_id);out.innerHTML=img+resultBox(s,shot.gps);}
  catch(e){
    if(e.fatal){await qDel(item.client_id);out.innerHTML=img+`<div class="result-pill bad"><span class="h">${esc(e.message)}</span></div>`;}
    else out.innerHTML=img+`<div class="result-pill warn"><span class="h">No network</span><span class="te" style="font-size:16px">ఫోటో ఫోన్‌లో సేవ్ అయింది, నెట్ రాగానే అప్‌లోడ్ అవుతుంది.</span><span class="muted">Saved on the phone with GPS and time; it uploads automatically.</span></div>`;
  }
}
function resultBox(s,g){
  const r=s.result, top=s.top_predictions[0], sure=top&&top.confidence>=0.7, healthy=sure&&top.label==='healthy';
  const crop=crops.find(c=>c.id===s.crop);
  const cropName=s.ai&&s.ai.crop_name_en&&s.crop==='other_crop'?`${s.ai.crop_name_te||''} / ${s.ai.crop_name_en}`:crop?`${crop.name_te} / ${crop.name_en}`:'';
  const pickedNote=s.ai&&s.ai.picked&&s.status!=='rejected'?`<p class="y" style="margin:10px 2px 0">You picked ${esc((crops.find(c=>c.id===s.ai.picked)||{}).name_en||s.ai.picked)}, but this looks like ${esc(s.ai.crop_name_en||'another crop')}. The result is for ${esc(s.ai.crop_name_en||'that crop')}.</p>`:'';
  let pill;
  if(s.status==='rejected')pill=`<div class="result-pill bad"><span class="h">${esc(r.name_en)}</span><span class="te">${esc(r.name_te)}</span></div>`;
  else if(!top||!sure)pill=`<div class="result-pill warn"><span class="h">${!top?'No AI model for this crop yet':'Not sure'}${top?` (${Math.round(top.confidence*100)}%)`:''}</span><span class="te">${esc(r.name_te)}</span><span class="muted">The agronomist will check this photo.</span></div>`;
  else if(healthy)pill=`<div class="result-pill ok"><span class="h">Healthy (${Math.round(top.confidence*100)}% confidence)</span><span class="te">${esc(r.name_te)}</span></div>`;
  else pill=`<div class="result-pill bad"><span class="h">${top.label==='other_problem'?'Problem found':'Disease found'}: <b>${esc(r.name_en)}</b> (${Math.round(top.confidence*100)}% confidence)</span><span class="te">${esc(r.name_te)}</span></div>`;
  const aiSees=s.status!=='rejected'&&s.ai&&s.ai.explanation_en?`<p class="muted" style="margin:10px 2px 0">${s.ai.engine==='gemini'?'Gemini AI':'AI'} sees: ${esc(s.ai.explanation_en)}</p>`:'';
  const loc=s.source==='upload'?(s.latitude!=null?`${s.latitude.toFixed(5)}, ${s.longitude.toFixed(5)} (from the photo) · uploaded photo`:'Uploaded photo, no location saved in it'):g?`${g.latitude.toFixed(5)}, ${g.longitude.toFixed(5)}`:'No GPS on this photo';
  return `${s.status!=='rejected'&&cropName?`<p class="muted" style="margin:12px 2px 0">Crop: <b style="color:var(--ink)">${esc(cropName)}</b></p>`:''}${pill}${pickedNote}${aiSees}
    <div class="card glow action"><div class="muted">Recommended action</div>
      <div class="head">${s.status==='rejected'?icons.camera:healthy?icons.shield:icons.spray}<span>${s.status==='rejected'?'Retake the photo':healthy?'Keep checking daily':'Act today'}</span></div>
      <div class="te">${esc(r.advice_te)}</div><div class="muted">${esc(r.advice_en)}</div>
      ${r.ai_generated?'<p class="y" style="font-size:13px;margin:10px 0 0">AI advice: a Zemli agronomist will check it. Ask before spraying anything.</p>':''}</div>
    <p class="muted">📍 ${loc} · ${me.role==='farmer'?'saved in your crop care log':"saved under the farmer's ID"}</p>`;
}

let fdata=null;
async function loadFarmer(){fdata=await api('/api/farmer/summary');localStorage.setItem('zemli_cache',JSON.stringify(fdata));}
function noticesHtml(){
  const n=(fdata.notices||[]).filter(x=>Date.now()-new Date(x.created_at)<3*864e5).slice(0,2);
  return n.map(x=>`<div class="notice ${x.kind}"><b>${esc(x.text_te)}</b><br><span class="muted">${esc(x.text_en)} · ${when(x.created_at)}</span></div>`).join('');
}
async function farmerView(render,withNotices){
  const m=$('#main');if(!fdata)m.innerHTML='<p class="muted">Loading…</p>';
  try{await loadFarmer();}catch(e){fdata=fdata||JSON.parse(localStorage.getItem('zemli_cache')||'null');if(!fdata){m.innerHTML=`<p class="err">${esc(e.message)}</p>`;return;}toast('Offline: showing saved data');}
  m.innerHTML=(withNotices?noticesHtml():'')+render(fdata);
}
const pct=(a,b)=>b>0?Math.max(0,Math.min(100,a/b*100)):0;

views.farm=async()=>{
  await farmerView(d=>{const i=d.iot,r=i.reading||{};
    const npkLow=i.low_nutrients||[];
    return `${title('Farm data','పొలం సెన్సర్లు')}<div style="margin-bottom:14px">${iotPill(i)}</div>
    <div class="card ${i.moisture==='dry'?'glow-red':'glow'}"><div class="row"><div class="grow"><div class="muted">Soil moisture / నేల తేమ</div>
      <div class="big ${i.moisture==='dry'?'r':''}">${r.soil_moisture!=null?r.soil_moisture+'%':'—'}</div>
      <div class="${i.moisture==='dry'?'r':'g'}">${i.moisture==='dry'?'పొడిగా ఉంది, డ్రిప్ ఆన్ చేయండి / Dry: switch on the drip':i.moisture?'తడి ఉంది / Wet enough':''}</div></div></div>
      <div id="sparkMoist"></div><div class="muted" style="font-size:12px">Last 24 h</div></div>
    <div class="tiles">
      <div class="tile ${i.nutrients==='low'?'glow-gold':'glow'}"><div class="label">NPK levels / పోషకాలు</div><div class="val ${i.nutrients==='low'?'y':'g'}">${i.nutrients==='low'?'Low':i.nutrients?'Optimal':'—'}</div>
        <div class="muted" style="font-size:13px;margin-top:6px">N ${r.nitrogen??'-'} · P ${r.phosphorus??'-'} · K ${r.potassium??'-'} mg/kg${npkLow.length?`<br><span class="y">Low: ${npkLow.join(', ')}</span>`:''}</div></div>
      <div class="tile ${i.weather==='hot'?'glow-red':''}"><div class="label">Air temperature</div><div class="val ${i.weather==='hot'?'r':''}">${r.air_temp!=null?r.air_temp+'°C':'—'}</div>
        <div class="muted" style="font-size:13px;margin-top:6px">Humidity ${r.humidity!=null?r.humidity+'%':'—'}</div><div id="barsTemp"></div></div></div>
    <p class="muted">${i.reading?`Updated ${when(r.ts)}`:''}</p>`;},true);
  try{const h=await api('/api/farmer/iot-history?hours=24');
    const sm=h.map(x=>x.soil_moisture).filter(v=>v!=null);if($('#sparkMoist'))$('#sparkMoist').innerHTML=spark(sm,0,100);
    const t=h.map(x=>x.air_temp).filter(v=>v!=null).slice(-10);
    if(t.length&&$('#barsTemp')){const lo=Math.min(...t)-2,hi=Math.max(...t),mx=Math.max(...t);$('#barsTemp').innerHTML=`<div class="bars">${t.map(v=>`<div class="${v===mx?'hi':''}" style="height:${10+((v-lo)/((hi-lo)||1))*90}%"></div>`).join('')}</div>`;}
  }catch(e){}
};

/* ======================= REALTIME ======================= */
let ws=null;
function connect(){
  if(!token)return;
  ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws?token=${encodeURIComponent(token)}`);
  ws.onopen=()=>{$('#dot').classList.add('on');flush();ws._p=setInterval(()=>ws.send('ping'),25000);};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.type==='notice'){toast(m.text_te);if(me.role==='farmer')views[curView]();}
    if(m.type==='scan_reviewed'){toast(`నిపుణులు చూశారు / Agronomist checked: ${m.scan.result.name_te} (${m.scan.result.name_en})`);if(me.role==='farmer'&&curView==='fscan')views.fscan();}
  };
  ws.onclose=()=>{$('#dot').classList.remove('on');clearInterval(ws?._p);if(token)setTimeout(connect,8000);};
}

/* ======================= INSTALL + START ======================= */
let installEvt=null;
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('#installBtn').classList.remove('hidden');});
$('#installBtn').onclick=async()=>{if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;$('#installBtn').classList.add('hidden');};

async function start(){
  if(!token){showLogin();return;}
  try{me=await api('/api/me');}catch(e){if(!token)return;me=JSON.parse(localStorage.getItem('zemli_me')||'null');if(!me){showLogin();return;}}
  localStorage.setItem('zemli_me',JSON.stringify(me));
  try{const c=await (await fetch('/api/crops')).json();crops=c.crops;autoOn=c.auto_detect;}catch(e){}
  if(me.role==='employee'){
    shell(`${me.name} · ${me.scan_id}`,[{v:'farmers',i:'home',l:'రైతులు',en:'Farmers'},{v:'field',i:'pin',l:'ఫీల్డ్',en:'Field audit'},{v:'scan',i:'sprout',l:'స్కాన్',en:'Crop care'},{v:'khata',i:'wallet',l:'ఖాతా',en:'Credit'}]);
    go('farmers');flush();
  }else{
    shell(me.name,[{v:'fdash',i:'home',l:'హోమ్',en:'Dashboard'},{v:'credit',i:'wallet',l:'బిల్లులు',en:'Credit'},{v:'farm',i:'chart',l:'పొలం',en:'Farm data'},{v:'fscan',i:'sprout',l:'స్కాన్',en:'Crop care'},{v:'pay',i:'rupee',l:'చెల్లింపు',en:'Payouts'}]);
    go('fdash');
  }
  connect();
}
start();
