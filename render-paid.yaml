# PAID always-on version (Starter + 1 GB disk, data kept). To use it, rename this file to render.yaml.
# Render -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: zemli
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: zemli-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false                  # Render asks you to paste your key from aistudio.google.com/apikey
      - key: GEMINI_MODEL
        value: gemini-flash-latest   # change if Google renames models (e.g. gemini-2.5-flash)
      - key: ZEMLI_API_KEY
        generateValue: true          # random admin key: see it under Environment
      - key: DATABASE_URL
        value: sqlite:////var/data/zemli.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: LOAD_DEMO
        value: "1"                   # loads the demo once; set to 0 when you remove demo data for the real pilot
